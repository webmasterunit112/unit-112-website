<style>
/* ACBL Unit 112 — site styles.
   Colors, font and base size are CSS variables the admin panel rewrites at runtime. */
:root {
  color-scheme: light;
  --primary: #1C4966;      /* Cayuga deep blue */
  --secondary: #2F6B4F;    /* vineyard green */
  --accent: #C08A2B;       /* autumn gold, used sparingly */
  --bg: #F3F7F6;           /* lake mist */
  --surface: #FFFFFF;
  --text: #15232B;
  --muted: #45565E;
  --line: #C9D6D6;
  --red-suit: #B3261E;
  --on-primary: #FFFFFF;
  --on-secondary: #FFFFFF;
  --focus: #F2B632;
  --base: 20px;
  --font-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --font-display: "Literata", "Georgia", "Times New Roman", serif;
  --radius: 10px;
  --maxw: 1120px;
}
html { font-size: var(--base); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.6;
}
html.hc { --bg:#FFFFFF; --surface:#FFFFFF; --text:#000000; --muted:#1A1A1A; --line:#000000; --primary:#002B4D; --secondary:#00391F; }
html.hc a { text-decoration-thickness: 3px; }

.skip { position: absolute; left: -999px; top: 8px; background: var(--focus); color: #000; padding: .6rem 1rem; font-weight: 700; z-index: 99; border-radius: 6px; }
.skip:focus { left: 16px; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
a { color: var(--primary); text-underline-offset: .18em; text-decoration-thickness: 2px; }
a:hover { color: var(--secondary); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; color: var(--primary); margin: 0 0 .5em; }
h1 { font-size: 2rem; font-weight: 700; }
h2 { font-size: 1.5rem; font-weight: 650; }
h3 { font-size: 1.2rem; font-weight: 650; }
p { margin: 0 0 1em; max-width: 68ch; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: 16px; }
@media (min-width: 700px) { .wrap { padding-inline: 28px; } }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.red { color: var(--red-suit); }

/* ---------- Header ---------- */
.topbar { background: var(--primary); color: var(--on-primary); font-size: .85rem; }
.topbar .wrap { display:flex; flex-wrap:wrap; gap:.5rem 1.25rem; align-items:center; justify-content:space-between; padding-block:.45rem; }
.topbar a { color: var(--on-primary); }
.topbar .suits { color: var(--on-primary); }
.topbar .suits .red { color: #FFB4AB; }
html.hc .topbar .suits .red { color: #FFFFFF; }
.textsize { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
.textsize button { font: inherit; font-weight:700; min-width:2.6rem; min-height:2.4rem; border-radius:6px; border:2px solid rgba(255,255,255,.55); background:transparent; color: var(--on-primary); cursor:pointer; }
.textsize button[aria-pressed="true"] { background: var(--on-primary); color: var(--primary); border-color: var(--on-primary); }
.masthead { background: var(--surface); border-bottom: 5px solid var(--secondary); }
.masthead.band { background: linear-gradient(180deg, var(--surface), var(--bg)); }
.masthead .wrap { display:flex; gap:1rem 1.25rem; align-items:center; padding-block:1.1rem; flex-wrap:wrap; }
.masthead.center .wrap { justify-content:center; text-align:center; flex-direction:column; }
.brand { display:flex; gap:1rem; align-items:center; text-decoration:none; color:inherit; }
.masthead.center .brand { flex-direction:column; }
.brand img { max-height: 84px; width:auto; }
.mark { width:78px; height:78px; border-radius: 14px; background: var(--primary); color: var(--on-primary); display:grid; place-items:center; font-family: var(--font-display); font-weight:800; font-size:1.55rem; line-height:1; flex:none; position:relative; }
.mark small { display:block; font-family: var(--font-body); font-size:.62rem; letter-spacing:.12em; font-weight:700; margin-top:.2rem; opacity:.9; }
.brand-name { font-family: var(--font-display); font-size: 1.75rem; font-weight: 750; color: var(--primary); line-height:1.1; }
.brand-tag { color: var(--muted); font-size: 1rem; margin-top:.25rem; }
.suits { letter-spacing:.35em; font-size:.95rem; color: var(--text); }

nav.main { background: var(--secondary); }
nav.main ul { list-style:none; margin:0; padding:.5rem 0; display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:.4rem; }
@media (min-width: 760px) { nav.main ul { display:flex; flex-wrap:wrap; } }
nav.main a { display:flex; align-items:center; justify-content:center; text-align:center; min-height: 3rem; padding:.35rem 1rem; color: var(--on-secondary); text-decoration:none; font-weight:700; border-radius: 8px; line-height:1.25; }
nav.main a:hover { background: rgba(127,127,127,.22); color: var(--on-secondary); }
nav.main a[aria-current="page"] { background: var(--surface); color: var(--secondary); }

#adminbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; }
.adminbar { background:#FFF4D6; color:#3B2A00; border-bottom:2px solid var(--accent); font-size:.9rem; }
.adminbar .wrap { display:flex; flex-wrap:wrap; gap:.5rem 1rem; align-items:center; padding-block:.5rem; }
.adminbar strong { margin-right:auto; }

/* ---------- Main ---------- */
main { padding-block: 1.75rem 3rem; }
.page-head { margin-bottom: 1.25rem; }
.page-head p { color: var(--muted); font-size: 1.05rem; }
.stack { display:grid; gap: 1.5rem; }
.panel { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; }
@media (min-width:700px){ .panel { padding: 1.5rem 1.75rem; } }
.grid2 { display:grid; gap:1.25rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
.muted { color: var(--muted); }
.lead { font-size: 1.12rem; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:.45rem; min-height: 3rem; padding: .5rem 1.15rem; border-radius: 8px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; border: 2px solid var(--primary); background: var(--primary); color: var(--on-primary); line-height:1.2; text-align:center; }
.btn:hover { filter: brightness(1.12); color: var(--on-primary); }
.btn.alt { background: var(--surface); color: var(--primary); }
.btn.alt:hover { background: var(--bg); color: var(--primary); filter:none; }
.btn.green { background: var(--secondary); border-color: var(--secondary); }
.btn.small { min-height: 2.4rem; padding:.3rem .8rem; font-size:.9rem; }
.btn.danger { background:#fff; color:#9B1C1C; border-color:#9B1C1C; }
.btn[disabled] { opacity:.45; cursor:not-allowed; }
.btnrow { display:flex; flex-wrap:wrap; gap:.6rem; }

/* Feature: next tournament */
.feature { background: var(--primary); color: var(--on-primary); border-radius: var(--radius); padding: 1.5rem; display:grid; gap:1rem 2rem; grid-template-columns: 1fr; }
@media (min-width: 760px) { .feature { grid-template-columns: auto 1fr auto; align-items:center; padding: 1.75rem 2rem; } }
.feature h2 { color: var(--on-primary); margin:0 0 .25rem; }
.feature .count { text-align:center; border:2px solid rgba(255,255,255,.4); border-radius: 10px; padding:.6rem 1rem; min-width: 7rem; }
.feature .count b { display:block; font-family: var(--font-display); font-size: 2.4rem; line-height:1; }
.feature .btn { background: var(--surface); color: var(--primary); border-color: var(--surface); }
.feature .btn.alt { background: transparent; color: var(--on-primary); border-color: rgba(255,255,255,.7); }
.eyebrow { text-transform: uppercase; letter-spacing:.1em; font-size:.8rem; font-weight:700; opacity:.9; }

/* Tournament list */
.tlist { display:grid; gap: 1rem; }
.tcard { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.25rem; display:grid; gap: .75rem 1.5rem; grid-template-columns: 1fr; }
@media (min-width: 760px) { .tcard { grid-template-columns: 8.5rem 1fr auto; align-items:center; } }
.tdate { font-family: var(--font-display); color: var(--primary); font-weight: 700; line-height:1.2; }
.tdate .mo { display:block; text-transform:uppercase; letter-spacing:.08em; font-size:.85rem; color: var(--secondary); font-family: var(--font-body); }
.tdate .d { font-size: 1.45rem; }
.tcard h3 { margin: 0 0 .2rem; }
.tmeta { color: var(--muted); font-size: .95rem; }
.pill { display:inline-block; font-size:.78rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:.15rem .55rem; border-radius: 999px; border:2px solid currentColor; margin-right:.4rem; vertical-align: .1em; }
.pill.live { color:#fff; background:#B3261E; border-color:#B3261E; }
.pill.up { color: var(--secondary); }
.pill.past { color: var(--muted); }

/* Clubs */
.clubs { display:grid; gap:1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.club { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.25rem; display:flex; flex-direction:column; gap:.5rem; }
.club h3 { margin:0; }
.club .btnrow { margin-top:auto; padding-top:.4rem; }
.club dl { margin:0; display:grid; grid-template-columns: auto 1fr; gap:.15rem .75rem; font-size:.95rem; }
.club dt { font-weight:700; color: var(--muted); }
.club dd { margin:0; }

/* Tables & lists */
.tablewrap { overflow-x:auto; }
table { border-collapse: collapse; width:100%; font-variant-numeric: tabular-nums; }
th, td { text-align:left; padding:.6rem .75rem; border-bottom:1px solid var(--line); vertical-align: top; }
th { color: var(--primary); font-size:.9rem; text-transform:uppercase; letter-spacing:.05em; }
.news { display:grid; gap: 1rem; }
.news article { border-left: 5px solid var(--secondary); padding: .25rem 0 .25rem 1rem; }
.news time { color: var(--muted); font-size:.9rem; font-weight:700; }
.news h3 { margin:.1rem 0 .35rem; }
.rich ul { padding-left: 1.3rem; margin: 0 0 1em; }
.rich li { margin-bottom:.35rem; }
.rich h2 { margin-top: 1.25rem; }
.empty { color: var(--muted); font-style: italic; }
.quick { display:grid; gap:.6rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); }
.quick a { display:block; padding:.75rem 1rem; border:2px solid var(--line); border-radius:8px; text-decoration:none; font-weight:700; background: var(--surface); }
.quick a:hover { border-color: var(--primary); }
.quick a span { display:block; font-weight:400; color: var(--muted); font-size:.88rem; }

footer.site { background: var(--primary); color: var(--on-primary); padding-block: 2rem; font-size: .95rem; }
footer.site a { color: var(--on-primary); }
footer.site .cols { display:grid; gap:1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); }
footer.site h2 { color: var(--on-primary); font-size:1.1rem; }
footer.site ul { list-style:none; padding:0; margin:0; display:grid; gap:.35rem; }
.partner-logos { display:flex; gap:1rem; flex-wrap:wrap; align-items:center; }
.partner-logos img { max-height:56px; background:#fff; border-radius:6px; padding:4px; }

/* ---------- Admin ---------- */
.admin { display:grid; gap:1.25rem; grid-template-columns: 1fr; }
@media (min-width: 900px) { .admin { grid-template-columns: 15rem 1fr; align-items:start; } }
.admin-tabs { display:grid; gap:.35rem; grid-template-columns: repeat(2, minmax(0,1fr)); }
@media (min-width: 900px) { .admin-tabs { grid-template-columns: 1fr; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 5rem); } }
.admin-tabs button { font: inherit; text-align:left; padding:.65rem .9rem; min-height:3rem; border-radius:8px; border:2px solid var(--line); background: var(--surface); color: var(--text); cursor:pointer; font-weight:700; }
.admin-tabs button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.form { display:grid; gap: 1rem; }
.field { display:grid; gap:.3rem; }
.field > label, .field > .lbl { font-weight:700; }
.field .help { font-size:.85rem; color: var(--muted); }
.field input[type=text], .field input[type=url], .field input[type=email], .field input[type=date], .field input[type=password], .field input[type=number], .field select, .field textarea {
  font: inherit; font-size: .95rem; padding: .6rem .7rem; border:2px solid var(--line); border-radius: 8px; background:#fff; color:#111; width:100%; box-sizing:border-box; min-height: 2.9rem;
}
.field textarea { min-height: 8rem; resize: vertical; line-height:1.5; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }
.field.check { display:flex; align-items:center; gap:.6rem; }
.field.check input { width:1.4rem; height:1.4rem; }
.row2 { display:grid; gap:1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
.item { border:2px solid var(--line); border-radius: 10px; background: var(--surface); }
.item > summary { list-style:none; cursor:pointer; padding:.8rem 1rem; display:flex; gap:.75rem; align-items:center; font-weight:700; min-height:3rem; }
.item > summary::-webkit-details-marker { display:none; }
.item > summary::before { content:"▸"; color: var(--secondary); }
.item[open] > summary::before { content:"▾"; }
.item > summary .sub { font-weight:400; color: var(--muted); font-size:.88rem; margin-left:auto; text-align:right; }
.item .body { padding: 0 1rem 1rem; display:grid; gap:1rem; }
.item-tools { display:flex; flex-wrap:wrap; gap:.5rem; border-top:1px solid var(--line); padding-top:.8rem; }
.derived { background: var(--bg); border-radius:8px; padding:.6rem .8rem; font-size:.88rem; word-break: break-all; }
.swatches { display:grid; gap:.75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 12rem), 1fr)); }
.swatch { display:flex; gap:.6rem; align-items:center; border:2px solid var(--line); border-radius:8px; padding:.4rem .6rem; background:#fff; }
.swatch input[type=color] { width:3rem; height:2.4rem; border:0; padding:0; background:none; cursor:pointer; }
.swatch label { font-weight:700; font-size:.9rem; color:#111; }
.swatch code { display:block; font-size:.78rem; color:#555; }
.presets { display:flex; flex-wrap:wrap; gap:.6rem; }
.preset { display:flex; align-items:center; gap:.5rem; font:inherit; font-size:.9rem; font-weight:700; padding:.45rem .8rem; border-radius:8px; border:2px solid var(--line); background:#fff; color:#111; cursor:pointer; min-height:2.8rem; }
.preset i { display:inline-block; width:1rem; height:1rem; border-radius:50%; }
.orderlist { list-style:none; padding:0; margin:0; display:grid; gap:.5rem; }
.orderlist li { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; border:2px solid var(--line); border-radius:8px; padding:.5rem .7rem; background:#fff; }
.orderlist li input[type=text] { flex:1 1 12rem; font:inherit; font-size:.95rem; padding:.4rem .6rem; border:2px solid var(--line); border-radius:6px; min-height:2.5rem; }
.orderlist .tag { font-size:.75rem; color: var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.imgprev { max-height: 90px; max-width: 100%; border:1px dashed var(--line); border-radius:6px; padding:4px; background:#fff; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background:#12312A; color:#fff; padding:.8rem 1.2rem; border-radius:10px; font-weight:700; z-index:50; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
.notice { border:2px solid var(--accent); background:#FFF8E6; color:#3B2A00; border-radius:8px; padding:.75rem 1rem; }
.notice p { margin:0; }
.login { max-width: 30rem; margin: 0 auto; }
.confirm { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; background:#FDECEC; color:#6B1111; border-radius:8px; padding:.5rem .75rem; font-weight:700; }
@media (prefers-reduced-motion: no-preference) { .btn, nav.main a, .quick a { transition: background-color .15s, border-color .15s, filter .15s; } }

/* ---------- Urgent notice banner ---------- */
.sitealert { font-size: 1.05rem; border-bottom: 3px solid rgba(0,0,0,.25); }
.sitealert .wrap { padding-block: .8rem; }
.sitealert.urgent { background: #9B1C1C; color: #fff; }
.sitealert.warning { background: #FCD34D; color: #1F1400; }
.sitealert.info { background: #DCEBF7; color: #0B2540; }
.sitealert a { color: inherit; font-weight: 700; }

/* ---------- Search ---------- */
.sitesearch { display: flex; gap: .5rem; flex: 1 1 min(100%, 18rem); max-width: 26rem; margin-left: auto; }
.masthead.center .sitesearch { margin: 0 auto; }
.sitesearch input { flex: 1; min-width: 0; font: inherit; font-size: .95rem; padding: .55rem .75rem; border: 2px solid var(--line); border-radius: 8px; min-height: 3rem; background: #fff; color: #111; }
.sitesearch input:focus { border-color: var(--primary); }
.sitesearch.big { max-width: 40rem; margin: 0 0 1.25rem; }
.results { padding-left: 1.4rem; display: grid; gap: 1rem; }
.results a { font-weight: 700; font-size: 1.1rem; }
.results p { margin: .25rem 0 0; color: var(--muted); }

/* ---------- Games / day filter ---------- */
.games { list-style: none; padding: 0; margin: 0; display: grid; gap: .35rem; }
.games li { padding: .35rem .6rem; border-radius: 6px; background: var(--bg); }
.games li.today { background: #E3F1E8; }
html.hc .games li.today { background: #fff; outline: 2px solid #000; }
.grid2 h3 { margin-bottom: .5rem; }
.dayfilter { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1.25rem; }
.dayfilter button { font: inherit; font-size: .92rem; font-weight: 700; min-height: 2.9rem; padding: .3rem .9rem; border-radius: 999px; border: 2px solid var(--primary); background: var(--surface); color: var(--primary); cursor: pointer; }
.dayfilter button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

/* ---------- Email sign-up ---------- */
.signup { display: grid; gap: .8rem; grid-template-columns: 1fr; max-width: 44rem; }
@media (min-width: 760px) { .signup { grid-template-columns: 1.3fr 1fr auto; align-items: end; } }
.signup-panel { border-top: 5px solid var(--secondary); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.formerr { color: #9B1C1C; font-weight: 700; margin: .75rem 0 0; }
.formok { color: var(--secondary); font-weight: 700; font-size: 1.1rem; margin: .5rem 0 0; }

/* ---------- Photos ---------- */
.photos { list-style: none; padding: 0; margin: 0; display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 12rem), 1fr)); }
.photos li { display: grid; gap: .3rem; font-size: .9rem; color: var(--muted); }
.photo { padding: 0; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; background: var(--bg); aspect-ratio: 4 / 3; max-width: 100%; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo:hover { border-color: var(--primary); }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(8, 14, 18, .94); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.lightbox img { max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 6px; }
.lightbox p { margin: 0; font-size: 1.1rem; text-align: center; }
.lb-bar { display: flex; gap: 1rem; justify-content: space-between; align-items: center; width: 100%; max-width: 60rem; }
.lightbox .btn { background: #fff; color: #111; border-color: #fff; }
.lightbox .btn.alt { background: transparent; color: #fff; border-color: rgba(255,255,255,.7); }

/* ---------- Admin additions ---------- */
.sep { border-top: 2px solid var(--line); padding-top: 1rem; }
.sep h3 { margin-bottom: .2rem; }
.sublist { border: 2px dashed var(--line); border-radius: 8px; padding: .8rem; margin: 0; display: grid; gap: .6rem; }
.sublist legend { padding: 0 .4rem; }
.subrows { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
.subrows li { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); align-items: end; background: var(--bg); padding: .6rem; border-radius: 8px; }
.subrows .field.wide { grid-column: span 2; }
@media (max-width: 520px) { .subrows .field.wide { grid-column: auto; } }
.photoedit { list-style: none; padding: 0; margin: 0; display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); }
.photoedit li { display: grid; gap: .5rem; background: var(--bg); padding: .6rem; border-radius: 8px; }
.photoedit img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; }
.checks { display: grid; gap: .4rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); }

<script>
/* ACBL Unit 112 website — public pages + webmaster admin panel.
   One file, no build step. Content lives in a single JSON object ("site").
   Live mode: loads/saves through /api/* (Cloudflare Pages Functions, see /functions).
   Demo mode: when no /api is present, saves go to this browser's localStorage. */
(function () {
  'use strict';

  // ---------- small helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const uid = (p) => p + Math.random().toString(36).slice(2, 9);
  const safe = (fn, fb) => { try { return fn(); } catch (e) { return fb; } };
  const ls = {
    get: (k) => safe(() => localStorage.getItem(k), null),
    set: (k, v) => safe(() => { localStorage.setItem(k, v); return true; }, false),
    del: (k) => safe(() => localStorage.removeItem(k)),
  };
  const ss = {
    get: (k) => safe(() => sessionStorage.getItem(k), null),
    set: (k, v) => safe(() => sessionStorage.setItem(k, v)),
    del: (k) => safe(() => sessionStorage.removeItem(k)),
  };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MON = MONTHS.map((m) => m.slice(0, 3));
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const parseDate = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  const todayISO = () => { const d = today(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const fmtDate = (s) => { const d = parseDate(s); return d ? MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() : ''; };
  function fmtRange(a, b) {
    const s = parseDate(a), e = parseDate(b) || s;
    if (!s) return 'Date to be announced';
    if (+s === +e) return DAYS[s.getDay()] + ', ' + MONTHS[s.getMonth()] + ' ' + s.getDate() + ', ' + s.getFullYear();
    if (s.getMonth() === e.getMonth()) return MONTHS[s.getMonth()] + ' ' + s.getDate() + '–' + e.getDate() + ', ' + s.getFullYear();
    return MON[s.getMonth()] + ' ' + s.getDate() + ' – ' + MON[e.getMonth()] + ' ' + e.getDate() + ', ' + e.getFullYear();
  }
  const daysBetween = (a, b) => Math.round((b - a) / 86400000);
  const DAY_KEYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function fmtTime(t) {
    const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); if (!m) return '';
    let h = +m[1]; const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
    return h + (m[2] === '00' ? '' : ':' + m[2]) + ' ' + ap;
  }
  const mapsUrl = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim());

  // ---------- state ----------
  const DEMO_PASSWORD = 'unit112';
  const LS_SITE = 'unit112-site-demo';
  let site = null;
  let mode = 'demo';          // 'live' when /api/site answers
  const LS_USERS = 'unit112-users-demo';
  const LS_SUBS = 'unit112-subs-demo';
  const LS_SUGG = 'unit112-suggestions-demo';
  const LS_SUGG_TO = 'unit112-suggest-to-demo';
  const DEFAULT_SUGGEST_TO = 'noahbellbridge@gmail.com';
  let token = ss.get('u112-token');
  let user = safe(() => JSON.parse(ss.get('u112-user')), null); // {username, name, role, clubs, tournaments}
  let dirty = false;
  let clubDay = 'all';        // Clubs page day filter
  let searchQuery = '';
  let lightbox = null;        // {album, i}
  const fullAccess = () => !!user && (user.role === 'owner' || user.role === 'editor');
  const isOwner = () => !!user && user.role === 'owner';
  let adminTab = 'branding';
  let pendingDelete = null;   // "listPath|index" awaiting inline confirm
  let pendingConfirm = null;  // e.g. 'reset', 'import'

  // ---------- backend ----------
  const backend = {
    async load() {
      try {
        const r = await fetch('/api/site', { cache: 'no-store' });
        const ct = r.headers.get('content-type') || '';
        if (r.ok && ct.includes('application/json')) {
          mode = 'live';
          const j = await r.json();
          return j && j.settings ? j : clone(window.DEFAULT_SITE);
        }
      } catch (e) { /* no API: demo mode */ }
      mode = 'demo';
      const raw = ls.get(LS_SITE);
      if (raw) { const j = safe(() => JSON.parse(raw), null); if (j && j.settings) return j; }
      return clone(window.DEFAULT_SITE);
    },
    async login(username, pw) {
      username = (username || 'webmaster').trim().toLowerCase();
      if (mode === 'live') {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username, password: pw }) });
        if (r.status === 429) throw new Error('Too many tries. Wait 15 minutes, then try again.');
        if (!r.ok) return false;
        const j = await r.json();
        token = j.token; user = j.user;
      } else {
        const u = demoUsers().find((x) => x.username === username && x.password === pw);
        if (!u) return false;
        token = 'demo'; user = { username: u.username, name: u.name, role: u.role, clubs: u.clubs || [], tournaments: u.tournaments || [] };
      }
      ss.set('u112-token', token); ss.set('u112-user', JSON.stringify(user));
      return true;
    },
    // ---- editor accounts (webmaster only) ----
    async listUsers() {
      if (mode !== 'live') return demoUsers().map((u) => Object.assign({}, u, { password: undefined }));
      const r = await this._auth('/api/users'); return (await r.json()).users || [];
    },
    async saveUser(u) {
      if (mode !== 'live') {
        const all = demoUsers(), i = all.findIndex((x) => x.username === u.username);
        const prev = i >= 0 ? all[i] : {};
        if (i < 0 && !u.password) throw new Error('Give the new account a password.');
        const rec = Object.assign({}, prev, u, { password: u.password || prev.password });
        if (i >= 0) all[i] = rec; else all.push(rec);
        ls.set(LS_USERS, JSON.stringify(all.filter((x) => x.username !== 'webmaster'))); return;
      }
      const r = await this._auth('/api/users', { method: 'POST', body: JSON.stringify(u) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'The account was not saved.');
    },
    async deleteUser(username) {
      if (mode !== 'live') { ls.set(LS_USERS, JSON.stringify(demoUsers().filter((x) => x.username !== username && x.username !== 'webmaster'))); return; }
      await this._auth('/api/users?u=' + encodeURIComponent(username), { method: 'DELETE' });
    },
    // ---- email reminders ----
    async subscribe(email, name, trap) {
      if (mode !== 'live') {
        const subs = demoSubs(); if (!subs.find((s) => s.email === email)) subs.push({ email, name, date: todayISO() });
        ls.set(LS_SUBS, JSON.stringify(subs)); return;
      }
      const r = await fetch('/api/subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email, name, website: trap }) });
      if (r.status === 429) throw new Error('Too many sign-ups from this connection. Try again later.');
      if (!r.ok) throw new Error('That email address was not accepted. Check it and try again.');
    },
    async listSubs() {
      if (mode !== 'live') return demoSubs();
      const r = await this._auth('/api/subscribers'); return (await r.json()).subscribers || [];
    },
    async removeSub(email) {
      if (mode !== 'live') { ls.set(LS_SUBS, JSON.stringify(demoSubs().filter((s) => s.email !== email))); return; }
      await this._auth('/api/subscribers?e=' + encodeURIComponent(email), { method: 'DELETE' });
    },
    async addSub(email, name) {
      if (mode !== 'live') return this.subscribe(email, name);
      const r = await this._auth('/api/subscribers', { method: 'POST', body: JSON.stringify({ email, name }) });
      if (!r.ok) throw new Error('That email address was not accepted.');
    },
    async send(msg) {
      if (mode !== 'live') throw new Error('Emails can only be sent from the live site, once an email service is connected (see the README).');
      const r = await this._auth('/api/send', { method: 'POST', body: JSON.stringify(msg) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Sending failed (error ' + r.status + ').');
      return j;
    },
    // ---- website suggestions ----
    async suggest(s) {
      if (mode !== 'live') {
        const all = safe(() => JSON.parse(ls.get(LS_SUGG) || '[]'), []) || [];
        all.unshift(Object.assign({ key: 'suggestion:' + new Date().toISOString(), date: new Date().toISOString() }, s));
        ls.set(LS_SUGG, JSON.stringify(all.slice(0, 100))); return { ok: true, emailed: false };
      }
      const r = await fetch('/api/suggest', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(s) });
      if (r.status === 429) throw new Error('Too many suggestions from this connection. Please try again in an hour.');
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Your suggestion was not sent. Please try again.');
      return r.json();
    },
    async suggestions() {
      if (mode !== 'live') return { to: ls.get(LS_SUGG_TO) || DEFAULT_SUGGEST_TO, emailReady: false, suggestions: safe(() => JSON.parse(ls.get(LS_SUGG) || '[]'), []) || [] };
      return (await this._auth('/api/suggest')).json();
    },
    async setSuggestTo(to) {
      if (mode !== 'live') { ls.set(LS_SUGG_TO, to); return; }
      const r = await this._auth('/api/suggest', { method: 'PUT', body: JSON.stringify({ to }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'The address was not saved.');
    },
    async deleteSuggestion(key) {
      if (mode !== 'live') { ls.set(LS_SUGG, JSON.stringify((safe(() => JSON.parse(ls.get(LS_SUGG) || '[]'), []) || []).filter((x) => x.key !== key))); return; }
      await this._auth('/api/suggest?key=' + encodeURIComponent(key), { method: 'DELETE' });
    },
    async campaigns() {
      if (mode !== 'live') return [];
      const r = await this._auth('/api/send'); return (await r.json()).campaigns || [];
    },
    async _auth(url, opt = {}) {
      const r = await fetch(url, Object.assign({}, opt, { headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token } }));
      if (r.status === 401) { logout(true); throw new Error('Your login has expired. Log in again.'); }
      if (r.status === 403) throw new Error('Your account is not allowed to do that.');
      return r;
    },
    async save(data) {
      if (mode === 'live') {
        const r = await fetch('/api/site', { method: 'PUT', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: JSON.stringify(data) });

    const flushL = () => { if (list.length) { out += '<ul>' + list.map((l) => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };

      const day = (d, label) => { const g = gamesOn(DAY_KEYS[d.getDay()]); return `<div><h3>${label} · ${DAYS[d.getDay()]}</h3>${g.length ? `<ul class="games">${g.map(gameLi).join('')}</ul>` : '<p class="empty">No club games listed.</p>'}</div>`; };

      return head(pageTitle('recognition'), site.content.recognitionIntro) + `<div class="stack">

      ${panel(`<h2>Unit 112 Board</h2>${site.board.length ? `<div class="tablewrap"><table><thead><tr><th scope="col">Position</th><th scope="col">Name</th><th scope="col">Email</th></tr></thead><tbody>${site.board.map((b) => `<tr><td>${esc(b.role)}</td><td>${esc(b.name)}</td><td>${b.email ? `<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Board members will be listed here.</p>'}`)}</div>`,
    documents: () => {
      const docs = site.documents.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      const cats = [...new Set(docs.map((d) => d.category || 'Other'))];
      return head(pageTitle('documents'), site.content.documentsIntro) + (docs.length ? `<div class="stack">${cats.map((c) => panel(`<h2>${esc(c)}</h2><ul>${docs.filter((d) => (d.category || 'Other') === c).map((d) => `<li><a href="${esc(d.url)}">${esc(d.title)}</a>${d.date ? ` <span class="muted">· ${esc(fmtDate(d.date))}</span>` : ''}</li>`).join('')}</ul>`)).join('')}</div>` : '<p class="empty">Bylaws, minutes and reports will be posted here.</p>');
    },
    contact: () => head(pageTitle('contact')) + `<div class="stack">${panel(`<div class="rich">${md(site.content.contact)}</div>${site.settings.contactEmail ? `<p><strong>Unit email:</strong> <a href="mailto:${esc(site.settings.contactEmail)}">${esc(site.settings.contactEmail)}</a></p>` : ''}`)}
      ${site.board.length ? panel(`<h2>Board members</h2><ul>${site.board.map((b) => `<li><strong>${esc(b.role)}:</strong> ${esc(b.name)}${b.email ? ` · <a href="mailto:${esc(b.email)}">${esc(b.email)}</a>` : ''}</li>`).join('')}</ul>`) : ''}${suggestForm()}</div>`,
  };

  function tournamentPage(t) {
    const st = tStatus(t), L = tLinks(t);
    const where = [t.venue, t.address, t.city].filter(Boolean).join(', ');
    const sessions = (t.sessions || []).slice().sort((a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')));
    const sec = (title, body) => body ? panel(`<h2>${title}</h2><div class="rich">${md(body)}</div>`) : '';
    const bl = (t.bulletins || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    return `<p><a href="#tournaments">← All tournaments</a></p><div class="page-head"><h1>${esc(t.name)}</h1>
      <p class="lead">${esc(fmtRange(t.start, t.end))}${t.city ? ' · ' + esc(t.city) : ''}</p>
      <div class="btnrow">${st !== 'upcoming' && L.results ? `<a class="btn" href="${esc(L.results)}">${st === 'live' ? 'Live results' : 'Results'}</a>` : ''}${L.flyer ? `<a class="btn ${st === 'upcoming' ? '' : 'alt'}" href="${esc(L.flyer)}">${L.flyerLabel}</a>` : ''}${where ? `<a class="btn alt" href="${esc(mapsUrl(where))}">Directions</a>` : ''}</div></div>
      <div class="stack">
      ${t.notes || t.details ? panel(`${t.notes ? `<p class="lead">${esc(t.notes)}</p>` : ''}<div class="rich">${md(t.details)}</div>`) : ''}
      ${sessions.length ? panel(`<h2>Schedule</h2><div class="tablewrap"><table><thead><tr><th scope="col">Day</th><th scope="col">Time</th><th scope="col">Event</th></tr></thead><tbody>${sessions.map((x) => { const d = parseDate(x.date); return `<tr><td>${d ? DAYS[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate() : ''}</td><td>${esc(fmtTime(x.time))}</td><td>${esc(x.event)}</td></tr>`; }).join('')}</tbody></table></div>`) : ''}
      ${where ? panel(`<h2>Where</h2><p>${esc(where)}</p><a class="btn alt" href="${esc(mapsUrl(where))}">Open in maps</a>`) : ''}
      ${bl.length ? panel(`<h2>Daily bulletins</h2><ul>${bl.map((b) => `<li><a href="${esc(b.url)}">${esc(b.title || 'Bulletin')}</a>${b.date ? ` <span class="muted">· ${esc(fmtDate(b.date))}</span>` : ''}</li>`).join('')}</ul>`) : ''}
      ${sec('Partnerships', t.partnership)}${sec('Hotels', t.hotels)}${sec('Food', t.food)}${sec('Parking', t.parking)}${sec('Contacts', t.contacts)}

  // ---------- site search ----------
  const stripMd = (s) => String(s || '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*#>-]/g, ' ');
  function searchIndex() {
    const idx = [], P = (id) => site.pages.find((p) => p.id === id);
    const add = (title, text, href, kind) => idx.push({ title, text: stripMd(text), href, kind });
    const shown = (id) => { const p = P(id); return p && (p.show || id === 'home'); };
    add(site.content.welcomeTitle, site.content.welcome, '#home', 'Home');
    site.news.filter(newsLive).forEach((n) => add(n.title, n.body + ' ' + fmtDate(n.date), '#home', 'News'));
    if (shown('tournaments')) site.tournaments.forEach((t) => add(t.name, [fmtRange(t.start, t.end), t.city, t.venue, t.address, t.notes, t.details, t.hotels, t.food, t.parking, t.partnership, t.contacts, (t.sessions || []).map((x) => x.event).join(' ')].join(' '), hasDetails(t) ? '#t-' + t.id : '#tournaments', 'Tournament'));
    if (shown('clubs')) site.clubs.forEach((c) => add(c.name + ' club', [c.city, c.address, c.schedule, c.contact, (c.games || []).map((g) => DAYS[DAY_KEYS.indexOf(g.day)] + ' ' + fmtTime(g.time) + ' ' + g.label).join(' ')].join(' '), '#clubs', 'Club'));
    ['newplayers', 'learn', 'about', 'contact'].forEach((id) => { if (shown(id)) add(P(id).title, site.content[id], '#' + id, 'Page'); });
    if (shown('learn')) (site.learn.teachers || []).forEach((t) => add(t.name, [t.area, t.when, t.contact, t.notes].join(' '), '#learn', 'Teacher'));
    if (shown('about')) site.board.forEach((b) => add(b.name, b.role, '#about', 'Board'));
    if (shown('documents')) site.documents.forEach((d) => add(d.title, d.category + ' ' + fmtDate(d.date), d.url, 'Document'));
    if (shown('recognition')) { site.recognition.lifeMasters.forEach((r) => add(r.name, 'New Life Master ' + (r.club || ''), '#recognition', 'Recognition')); site.recognition.milestones.forEach((r) => add(r.name, r.achievement, '#recognition', 'Recognition')); }
    if (shown('gallery')) (site.gallery || []).forEach((a) => add(a.title, (a.photos || []).map((p) => p.caption).join(' '), '#gallery', 'Photos'));
    site.pages.filter((p) => p.custom && p.show).forEach((p) => add(p.title, p.body, '#' + p.id, 'Page'));
    return idx;
  }
  function searchPage() {
    const q = searchQuery.trim().toLowerCase();
    const words = q.split(/\s+/).filter(Boolean);
    const hits = !words.length ? [] : searchIndex().map((it) => {
      const hay = (it.title + ' ' + it.text).toLowerCase();
      if (!words.every((w) => hay.includes(w))) return null;
      const score = words.reduce((s, w) => s + (it.title.toLowerCase().includes(w) ? 3 : 1), 0);
      const pos = it.text.toLowerCase().indexOf(words[0]);
      const snip = pos >= 0 ? (pos > 60 ? '…' : '') + it.text.slice(Math.max(0, pos - 60), pos + 120).replace(/\s+/g, ' ').trim() + '…' : '';
      return Object.assign({ score, snip }, it);
    }).filter(Boolean).sort((a, b) => b.score - a.score);
    return `<div class="page-head"><h1>Search</h1></div>
      <form class="sitesearch big" id="searchform2" role="search"><label class="sr" for="q2">Search this site</label><input type="search" id="q2" value="${esc(searchQuery)}" placeholder="Try: Elmira, Tuesday, bylaws, 499er"><button class="btn" type="submit">Search</button></form>
      ${words.length ? `<p class="muted" role="status">${hits.length} result${hits.length === 1 ? '' : 's'} for “${esc(searchQuery)}”</p>
      <ol class="results">${hits.map((h) => `<li><a href="${esc(h.href)}">${esc(h.title)}</a> <span class="pill past">${esc(h.kind)}</span>${h.snip ? `<p>${esc(h.snip)}</p>` : ''}</li>`).join('')}</ol>` : '<p class="muted">Type a club, town, day of the week or topic.</p>'}`;
  }

  function lightboxHTML() {
    if (!lightbox) return '';
    const al = (site.gallery || []).find((a) => a.id === lightbox.album); if (!al) return '';
    const ph = al.photos[lightbox.i]; if (!ph) return '';
    return `<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo ${lightbox.i + 1} of ${al.photos.length}">
      <div class="lb-bar"><span>${esc(al.title)} · ${lightbox.i + 1} of ${al.photos.length}</span><button class="btn" data-act="lb-close">Close ✕</button></div>
      <img src="${esc(ph.url)}" alt="${esc(ph.caption || al.title)}">${ph.caption ? `<p>${esc(ph.caption)}</p>` : ''}
      <div class="btnrow lb-nav"><button class="btn alt" data-act="lb-prev" ${lightbox.i === 0 ? 'disabled' : ''}>← Previous</button><button class="btn alt" data-act="lb-next" ${lightbox.i === al.photos.length - 1 ? 'disabled' : ''}>Next →</button></div></div>`;
  }
  function renderLightbox() {
    $('#lb').innerHTML = lightboxHTML();
    document.body.style.overflow = lightbox ? 'hidden' : '';
    if (lightbox) $('#lb [data-act="lb-close"]').focus();
  }

  function suggestForm() {
    if (!site.settings.showSuggest) return '';
    const pages = visiblePages().map((p) => p.title);
    return panel(`<h2 id="suggest">${esc(site.content.suggestTitle)}</h2><p>${esc(site.content.suggestText)}</p>
      <form id="suggestform" class="form" novalidate>
        <div class="field"><label for="sg-msg">Your suggestion</label><textarea id="sg-msg" rows="5" required></textarea></div>
        <div class="field"><label for="sg-page">Which page is it about?</label><select id="sg-page"><option value="">The whole site / not sure</option>${pages.map((t) => `<option>${esc(t)}</option>`).join('')}</select></div>
        <div class="row2"><div class="field"><label for="sg-name">Your name (optional)</label><input type="text" id="sg-name" autocomplete="name"></div>
        <div class="field"><label for="sg-email">Your email (optional)</label><input type="email" id="sg-email" autocomplete="email" aria-describedby="sg-email-h"><span class="help" id="sg-email-h">Only if you'd like a reply.</span></div></div>
        <div class="hp" aria-hidden="true"><label for="sg-web">Leave this empty</label><input type="text" id="sg-web" tabindex="-1" autocomplete="off"></div>
        <div><button class="btn green" type="submit">Send suggestion</button></div>
      </form><div id="suggestmsg" role="status"></div>`, 'signup-panel');
  }

  function renderPublic(id) {
    if (id === 'search') return searchPage();
    if (id.startsWith('t-')) { const t = site.tournaments.find((x) => 't-' + x.id === id); if (t) return tournamentPage(t); }
    const p = site.pages.find((x) => x.id === id);
    if (p && p.custom) return head(p.title) + panel(`<div class="rich">${md(p.body)}</div>`);
    if (PAGES[id] && (!p || p.show || id === 'home' || token)) return PAGES[id]();
    return `<h1>Page not found</h1><p>That page is not on this site. <a href="#home">Go to the home page</a>.</p>`;
  }

  // ---------- render ----------
  function render(scrollTop) {
    const r = route();
    renderChrome();
    $('#view').innerHTML = r === 'admin' ? renderAdmin() : renderPublic(r);
    if (scrollTop) { window.scrollTo(0, 0); }
  }
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
  }
  function markDirty() { if (!dirty) { dirty = true; renderChrome(); } }
  function logout(expired) {
    token = null; ss.del('u112-token');
    if (!expired) { user = null; ss.del('u112-user'); }
    if (!expired) { dirty = false; }
    render();
  }

    ['email', 'Email reminders'],
    ['suggestions', 'Website suggestions'],
    ['accounts', 'Editor accounts'],
    ['backup', 'Backup, password & handoff'],

  // ---- path helpers ("tournaments.3.name") ----
  function getPath(p) { return p.split('.').reduce((o, k) => (o == null ? o : o[k]), site); }
  function setPath(p, v) { const ks = p.split('.'), last = ks.pop(); const o = ks.reduce((o, k) => o[k], site); o[last] = v; }
  const fid = (path) => 'f-' + path.replace(/\./g, '-');

  // ---- field rendering ----
  function inputHTML(t, path, v, extra = '') {
    return `<input type="${t}" id="${fid(path)}" data-path="${path}" value="${esc(v)}"${extra}>`;
  }
  function selectHTML(opts, path, v, extra = '') {
    return `<select id="${fid(path)}" data-path="${path}"${extra}>${opts.map((o) => { const val = Array.isArray(o) ? o[0] : o, lab = Array.isArray(o) ? o[1] : o; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
  }
  function fileControl(path, v, isImg, label, kind) {
    const id = fid(path);
    const prev = v ? (isImg ? `<img class="imgprev" src="${esc(v)}" alt="Current image">` : `<a href="${esc(v)}">${v.startsWith('data:') ? 'Uploaded file' : esc(v.length > 60 ? v.slice(0, 57) + '…' : v)}</a>`) : '<span class="muted">None yet</span>';
    return `<div>${prev}</div><div class="btnrow"><label class="btn small alt" for="${id}-up">Upload ${isImg ? 'image' : 'file'}</label><input class="sr" type="file" id="${id}-up" data-upload="${path}" data-kind="${kind || (isImg ? 'image' : 'file')}" accept="${isImg ? 'image/*' : '.pdf,.doc,.docx,.xls,.xlsx,.txt,image/*'}">
      ${v ? `<button class="btn small danger" data-act="clearfield" data-path="${path}">Remove</button>` : ''}</div>
      ${!isImg ? `<input type="url" id="${id}" data-path="${path}" value="${v && !v.startsWith('data:') ? esc(v) : ''}" placeholder="…or paste a link" aria-label="${esc(label)} link">` : ''}`;
  }
  function fieldHTML(f, base) {
    if (f.row) return `<div class="row2">${f.row.map((x) => fieldHTML(x, base)).join('')}</div>`;
    if (f.sep) return `<div class="sep"><h3>${esc(f.sep)}</h3>${f.h ? `<p class="help">${esc(f.h)}</p>` : ''}</div>`;
    const path = base + '.' + f.k, id = fid(path), v = getPath(path);
    const help = f.h ? `<span class="help" id="${id}-h">${esc(f.h)}</span>` : '';
    const dby = f.h ? ` aria-describedby="${id}-h"` : '';
    const t = f.t || 'text';
    if (t === 'check') return `<div class="field check"><input type="checkbox" id="${id}" data-path="${path}" ${v ? 'checked' : ''}><label for="${id}">${esc(f.l)}</label></div>`;
    if (t === 'textarea') return `<div class="field"><label for="${id}">${esc(f.l)}</label><textarea id="${id}" data-path="${path}"${dby} rows="${f.rows || 7}">${esc(v)}</textarea>${help}</div>`;
    if (t === 'select') return `<div class="field"><label for="${id}">${esc(f.l)}</label>${selectHTML(f.o, path, v)}${help}</div>`;
    if (t === 'image' || t === 'file' || t === 'icon') return `<div class="field"><span class="lbl">${esc(f.l)}</span>${fileControl(path, v, t !== 'file', f.l, t === 'icon' ? 'icon' : null)}${help}</div>`;
    if (t === 'sublist') {
      const rows = v || [];
      return `<fieldset class="field sublist"><legend class="lbl">${esc(f.l)}</legend>${help}
        ${rows.length ? `<ol class="subrows">${rows.map((r, j) => `<li>${f.cols.map((c) => {
          const cp = path + '.' + j + '.' + c.k, lab = `${c.l} (${f.noun} ${j + 1})`;
          if (c.t === 'select') return `<div class="field"><label for="${fid(cp)}">${esc(c.l)}</label>${selectHTML(c.o, cp, r[c.k])}</div>`;
          if (c.t === 'file') return `<div class="field wide"><span class="lbl">${esc(c.l)}</span>${fileControl(cp, r[c.k], false, lab)}</div>`;
          return `<div class="field${c.t ? '' : ' wide'}"><label for="${fid(cp)}">${esc(c.l)}</label>${inputHTML(c.t || 'text', cp, r[c.k], c.ph ? ` placeholder="${esc(c.ph)}"` : '')}</div>`;
        }).join('')}<button class="btn small danger" data-act="subdel" data-path="${path}" data-i="${j}">Remove ${esc(f.noun)}</button></li>`).join('')}</ol>` : `<p class="empty">No ${esc(f.noun)}s yet.</p>`}
        <div><button class="btn small green" data-act="subadd" data-path="${path}" data-blank='${esc(JSON.stringify(f.blank))}'>Add a ${esc(f.noun)}</button></div></fieldset>`;
    }
    if (t === 'photos') {
      const ph = v || [];
      return `<fieldset class="field sublist"><legend class="lbl">${esc(f.l)}</legend>
        ${ph.length ? `<ol class="photoedit">${ph.map((p, j) => `<li><img src="${esc(p.url)}" alt=""><div class="field"><label for="${fid(path + '.' + j + '.caption')}">Caption</label>${inputHTML('text', path + '.' + j + '.caption', p.caption, ' placeholder="Who and what is in the photo"')}</div>
          <div class="btnrow"><button class="btn small alt" data-act="up" data-list="${path}" data-i="${j}" ${j === 0 ? 'disabled' : ''}>Earlier</button><button class="btn small alt" data-act="down" data-list="${path}" data-i="${j}" ${j === ph.length - 1 ? 'disabled' : ''}>Later</button><button class="btn small danger" data-act="subdel" data-path="${path}" data-i="${j}">Remove</button></div></li>`).join('')}</ol>` : '<p class="empty">No photos yet.</p>'}
        <div class="btnrow"><label class="btn small green" for="${id}-multi">Add photos</label><input class="sr" type="file" multiple accept="image/*" id="${id}-multi" data-multi="${path}"></div>
        <span class="help">You can pick several photos at once. Large photos are shrunk automatically. Captions help people using screen readers.</span></fieldset>`;
    }
    return `<div class="field"><label for="${id}">${esc(f.l)}</label>${inputHTML(t, path, v, dby)}${help}</div>`;
  }

  function derivedHTML(listKey, i) {
    const it = getPath(listKey)[i];
    if (listKey === 'tournaments') {
      const L = tLinks(it), s = String(it.sanction || '').trim();
      const warn = s && !validSanction(s) ? '<div style="color:#9B1C1C;font-weight:700">A sanction number is 7 digits. Check the ACBL flyer.</div>' : '';
      return `${warn}<div><strong>Status:</strong> ${({ upcoming: 'Upcoming', live: 'Playing now', past: 'Completed' })[tStatus(it)]}</div>
        <div><strong>${L.flyerLabel}:</strong> ${L.flyer ? `<a href="${esc(L.flyer)}">${esc(L.flyer)}</a>` : 'none'}</div>
        <div><strong>Results:</strong> ${L.results ? `<a href="${esc(L.results)}">${esc(L.results)}</a>` : 'none'}</div>
        <div><strong>Tournament page:</strong> ${hasDetails(it) ? `<a href="#t-${esc(it.id)}">view it</a>` : 'not yet (fill in the Tournament page section)'}</div>`;
    }
    const L = cLinks(it);
    return `<div><strong>Results link:</strong> ${L.live ? `<a href="${esc(L.live)}">${esc(L.live)}</a>` : 'none'}</div><div><strong>Common Game:</strong> ${L.tcg ? `<a href="${esc(L.tcg)}">${esc(L.tcg)}</a>` : 'none'}</div>`;
  }

  // opts: openIndex, extraButtons, only (array of ids: show just these), locked (no add/move/delete)
  function listEditor(schemaKey, listPath, opts = {}) {
    const S = SCHEMAS[schemaKey], arr = getPath(listPath) || [];
    const items = arr.map((it, i) => {
      if (opts.only && !opts.only.includes(it.id)) return '';
      const key = listPath + '|' + i;
      const open = opts.openIndex === i || (opts.only && opts.only.length === 1) || pendingDelete === key ? ' open' : '';
      const confirm = pendingDelete === key
        ? `<div class="confirm" role="alert">Delete this ${S.noun}? <button class="btn small danger" data-act="del-yes" data-list="${listPath}" data-i="${i}">Yes, delete</button><button class="btn small alt" data-act="del-no">Keep it</button></div>`
        : `<button class="btn small danger" data-act="del" data-list="${listPath}" data-i="${i}">Delete</button>`;
      const tools = opts.locked ? '' : `<div class="item-tools"><button class="btn small alt" data-act="up" data-list="${listPath}" data-i="${i}" ${i === 0 ? 'disabled' : ''}>Move up</button><button class="btn small alt" data-act="down" data-list="${listPath}" data-i="${i}" ${i === arr.length - 1 ? 'disabled' : ''}>Move down</button>${confirm}</div>`;
      return `<details class="item"${open}><summary><span data-sum="${listPath}.${i}" data-schema="${schemaKey}">${esc(S.title(it))}</span><span class="sub" data-subsum="${listPath}.${i}">${esc(S.sub(it))}</span></summary>
        <div class="body">${S.fields.map((f) => fieldHTML(f, listPath + '.' + i)).join('')}
        ${S.derived ? `<div class="derived" id="derived-${listPath.replace(/\./g, '-')}-${i}" aria-live="polite">${derivedHTML(listPath, i)}</div>` : ''}
        ${tools}</div></details>`;
    }).join('');
    return `<div class="stack" style="gap:.6rem">
      ${opts.locked ? '' : `<div class="btnrow"><button class="btn green" data-act="add" data-list="${listPath}" data-schema="${schemaKey}">Add a ${S.noun}</button>${opts.extraButtons || ''}</div>`}
      ${items || `<p class="empty">${opts.locked ? 'Nothing has been assigned to your account yet. Ask the webmaster.' : `Nothing here yet. Press "Add a ${S.noun}".`}</p>`}</div>`;
  }
  let openAfterAdd = null; // {list, i}
  function openIdx(list) { return openAfterAdd && openAfterAdd.list === list ? openAfterAdd.i : -1; }

  function orderList(listPath, row) {
    const arr = getPath(listPath);
    return `<ol class="orderlist">${arr.map((it, i) => `<li>
      <button class="btn small alt" data-act="up" data-list="${listPath}" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button>
      <button class="btn small alt" data-act="down" data-list="${listPath}" data-i="${i}" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="Move down">▼</button>
      ${row(it, i)}</li>`).join('')}</ol>`;
  }

  // async-loaded admin data (accounts, subscribers)
  let accounts = null, editingUser = null, subs = null, campaignList = null, mailDraft = null, sugg = null;

  function passwordPanel() {
    if (mode !== 'live') return `<div class="panel"><h3>Change your password</h3><p>This is the demo copy. Demo passwords can't be changed. On the live site you change yours here.</p></div>`;
    return `<div class="panel"><h3>Change your password</h3><div class="row2"><div class="field"><label for="pw-cur">Current password</label><input type="password" id="pw-cur" autocomplete="current-password"></div><div class="field"><label for="pw-new">New password (10+ characters)</label><input type="password" id="pw-new" autocomplete="new-password"></div></div><div class="btnrow" style="margin-top:.75rem"><button class="btn" data-act="changepw">Change password</button></div></div>`;
  }

  // ---- tabs ----
  const ADMIN_TABS = {
    alert() {
      const A = site.settings.alert;
      const live = A.on && A.text && (!A.until || todayISO() <= A.until);
      return `<h2>Urgent notice</h2><div class="form">
        <p>Shows a bright bar across the top of every page. Use it for cancellations, weather closures and venue changes.</p>
        <div class="notice"><p><strong>Right now:</strong> ${live ? 'the notice is showing on the site' : 'no notice is showing'}${A.on && A.until && todayISO() > A.until ? ' (it switched off after ' + esc(fmtDate(A.until)) + ')' : ''}.</p></div>
        ${fieldHTML({ k: 'on', l: 'Show the notice', t: 'check' }, 'settings.alert')}
        ${fieldHTML({ k: 'text', l: 'Message', h: 'Keep it short, e.g. "Syracuse game cancelled today (Tuesday) because of snow."' }, 'settings.alert')}
        <div class="row2">${fieldHTML({ k: 'level', l: 'Style', t: 'select', o: [['urgent', 'Urgent (red)'], ['warning', 'Warning (yellow)'], ['info', 'Information (blue)']] }, 'settings.alert')}
        ${fieldHTML({ k: 'until', l: 'Switch off after (optional)', t: 'date', h: 'The notice disappears on its own after this date.' }, 'settings.alert')}</div>
        ${fieldHTML({ k: 'link', l: 'Link for more information (optional)', t: 'url' }, 'settings.alert')}
        <p class="help">Press Save for members to see the change.</p></div>`;
    },
    branding() {
      const st = site.settings, c = st.colors;
      const warn = [];
      if (contrast(c.text, c.bg) < 7) warn.push('Text on the page background is below the high-readability level (7:1). Consider a darker text color.');
      if (contrast(c.primary, onColor(c.primary)) < 4.5) warn.push('Button and header text will be hard to read on the main color.');
      if (contrast(c.secondary, onColor(c.secondary)) < 4.5) warn.push('Menu text will be hard to read on the menu bar color.');
      return `<h2>Look & logo</h2><div class="form">
        ${fieldHTML({ k: 'siteName', l: 'Site name' }, 'settings')}
        ${fieldHTML({ k: 'tagline', l: 'Tagline (top bar)' }, 'settings')}
        ${fieldHTML({ k: 'logo', l: 'Logo', t: 'image' }, 'settings')}

  function reminderFor(t) {
    const L = tLinks(t), base = mode === 'live' ? location.origin : '';
    const lines = [`${t.name}`, `${fmtRange(t.start, t.end)}${t.city ? ' · ' + t.city : ''}`, ''];
    if (t.venue || t.address) lines.push('Where: ' + [t.venue, t.address, t.city].filter(Boolean).join(', '));
    if (t.notes) lines.push(t.notes);
    const s = (t.sessions || []).slice().sort((a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')));
    if (s.length) { lines.push('', 'Schedule:'); s.forEach((x) => { const d = parseDate(x.date); lines.push(`  ${d ? DAYS[d.getDay()] : ''} ${fmtTime(x.time)}  ${x.event}`); }); }
    if (t.partnership) lines.push('', 'Need a partner? ' + stripMd(t.partnership).replace(/\s+/g, ' ').trim());
    lines.push('');
    if (L.flyer) lines.push(L.flyerLabel + ': ' + L.flyer);
    if (hasDetails(t) && base) lines.push('Details: ' + base + '/#t-' + t.id);
    lines.push('', 'We hope to see you there!', site.settings.siteName);
    return { subject: `Reminder: ${t.name}, ${fmtRange(t.start, t.end)}`, text: lines.join('\n') };
  }

        <div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required></div>
        <div id="loginerr" role="alert"></div><button class="btn" type="submit">Log in</button></form>
        ${mode === 'demo' ? `<div class="notice" style="margin-top:1rem"><p>Demo copy: log in as <strong>webmaster</strong> with password <strong>${DEMO_PASSWORD}</strong>. Example helper logins: <strong>ithaca</strong> / <strong>club112</strong> (club manager) and <strong>rochester</strong> / <strong>chair112</strong> (tournament chair). Changes are saved in this browser only.</p></div>` : ''}</div>`;
    }
    const tabs = myTabs();
    if (!tabs.find((t) => t[0] === adminTab)) adminTab = tabs[0][0];
    const body = ADMIN_TABS[adminTab]();
    openAfterAdd = null;
    const leave = pendingConfirm === 'logout' ? `<div class="confirm" role="alert" style="margin-bottom:1rem">You have unsaved changes. <button class="btn small green" data-act="save-logout">Save and log out</button><button class="btn small danger" data-act="discard-logout">Log out without saving</button><button class="btn small alt" data-act="cancel">Stay</button></div>` : '';
    return `${leave}<div class="admin"><div class="admin-tabs" role="tablist" aria-label="Admin sections">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === adminTab}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div>
      <section class="panel" role="tabpanel" aria-label="${esc((tabs.find((t) => t[0] === adminTab) || [])[1])}">${body}
      ${['accounts', 'email', 'password'].includes(adminTab) ? '' : '<div class="btnrow" style="margin-top:1.5rem;border-top:1px solid var(--line);padding-top:1rem"><button class="btn green" data-act="save">Save changes</button><a class="btn alt" href="#home">View the site</a></div>'}</section></div>`;
  }
  function rerenderAdmin(keepOpen = true) {
    if (route() !== 'admin') return;
    const y = window.scrollY;
    const open = keepOpen ? [...document.querySelectorAll('details.item[open] [data-sum]')].map((e) => e.dataset.sum) : [];
    $('#view').innerHTML = renderAdmin();
    open.forEach((k) => { const s = document.querySelector(`[data-sum="${k}"]`); if (s) s.closest('details').open = true; });
    window.scrollTo(0, y);
  }

  // ---- admin clicks ----
  async function adminClick(b, act, e) {
    const list = b.dataset.list, i = +b.dataset.i;
    switch (act) {
      case 'tab': adminTab = b.dataset.tab; pendingDelete = null; pendingConfirm = null; editingUser = null; rerenderAdmin(false); $('.admin-tabs [aria-selected="true"]').focus(); if (window.innerWidth < 900) $('[role=tabpanel]').scrollIntoView(); return;
      case 'add': { const arr = getPath(list); const it = Object.assign({ id: uid('x') }, SCHEMAS[b.dataset.schema].blank()); arr.push(it); openAfterAdd = { list, i: arr.length - 1 }; markDirty(); rerenderAdmin(); const f = document.querySelectorAll('details.item[open] input, details.item[open] textarea'); if (f.length) f[0].focus(); return; }
      case 'up': case 'down': { const arr = getPath(list), j = act === 'up' ? i - 1 : i + 1; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; markDirty(); const sm = document.querySelector(`[data-sum="${list}.${i}"]`), wasOpen = sm && sm.closest('details').open; rerenderAdmin(false); if (wasOpen) { const n = document.querySelector(`[data-sum="${list}.${j}"]`); if (n) n.closest('details').open = true; } const mv = document.querySelector(`[data-act="${act}"][data-list="${list}"][data-i="${j}"]`); if (mv && !mv.disabled) mv.focus(); if (list === 'pages') renderChrome(); return; }
      case 'del': pendingDelete = list + '|' + i; rerenderAdmin(); return;
      case 'del-no': pendingDelete = null; rerenderAdmin(); return;
      case 'del-yes': getPath(list).splice(i, 1); pendingDelete = null; markDirty(); rerenderAdmin(false); if (list === 'pages') renderChrome(); toast('Deleted. Press Save to update the site.'); return;
      case 'subadd': { const arr = getPath(b.dataset.path); arr.push(JSON.parse(b.dataset.blank)); markDirty(); rerenderAdmin(); const rows = document.querySelectorAll(`[data-path^="${b.dataset.path}.${arr.length - 1}."]`); if (rows.length) rows[0].focus(); return; }
      case 'subdel': getPath(b.dataset.path).splice(i, 1); markDirty(); rerenderAdmin(); return;
      case 'sortlist': getPath(list).sort(byStart); markDirty(); rerenderAdmin(); return;
      case 'addpage': site.pages.push({ id: uid('page-'), title: 'New page', show: true, custom: true, body: '## Heading\nWrite your text here.' }); markDirty(); renderChrome(); rerenderAdmin(); toast('Page added. Rename it here and write its text on the Page text tab.'); return;
      case 'preset': site.settings.colors = Object.assign({}, PRESETS[b.dataset.name]); markDirty(); applyTheme(); rerenderAdmin(); return;
      case 'clearfield': setPath(b.dataset.path, ''); markDirty(); rerenderAdmin(); renderChrome(); return;
      case 'export': {
        const blob = new Blob([JSON.stringify(site, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'unit112-site-backup-' + todayISO() + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        toast('If no file downloaded, use "Show backup as text" and copy it.'); return;
      }
      case 'showjson': $('#jsonbox').innerHTML = `<div class="field" style="margin-top:1rem"><label for="jsontext">Backup text</label><textarea id="jsontext" rows="8" readonly>${esc(JSON.stringify(site, null, 2))}</textarea></div><button class="btn small alt" data-act="copyjson">Copy to clipboard</button>`; return;
      case 'copyjson': { const t = $('#jsontext'); try { await navigator.clipboard.writeText(t.value); toast('Copied.'); } catch (err) { t.focus(); t.select(); toast('Press Ctrl+C (or ⌘C) to copy the selected text.'); } return; }
      case 'import': {
        let text = $('#importtext').value.trim();
        const f = $('#importfile').files[0];
        if (f) text = await f.text();
        const j = safe(() => JSON.parse(text), null);
        if (!j || !j.settings || !Array.isArray(j.pages)) { toast('That is not a Unit 112 backup file.'); return; }
        site = j; markDirty(); applyTheme(); render(); toast('Backup loaded. Press Save to publish it.'); return;
      }
      case 'listbackups': {
        const bl = await backend.listBackups();
        $('#serverbackups').innerHTML = bl.length ? `<ul>${bl.map((k) => `<li>${esc(new Date(k.time).toLocaleString())} <button class="btn small alt" data-act="loadbackup" data-key="${esc(k.key)}">Load</button></li>`).join('')}</ul>` : '<p class="empty">No saved versions yet.</p>';
        return;
      }
      case 'loadbackup': try { site = await backend.getBackup(b.dataset.key); markDirty(); applyTheme(); render(); toast('Older version loaded. Press Save to publish it.'); } catch (err) { toast(err.message); } return;
      case 'changepw': {
        const cur = $('#pw-cur').value, nx = $('#pw-new').value;
        if (nx.length < 10) { toast('Use at least 10 characters for the new password.'); return; }
        try { await backend.changePassword(cur, nx); $('#pw-cur').value = ''; $('#pw-new').value = ''; toast('Password changed.'); } catch (err) { toast(err.message); }
        return;
      }
      // accounts
      case 'acc-new': editingUser = { isNew: true, username: '', name: '', role: 'club', clubs: [], tournaments: [], password: '' }; rerenderAdmin(); $('#acc-username').focus(); return;
      case 'acc-edit': { const a = accounts.find((x) => x.username === b.dataset.u); editingUser = Object.assign({ clubs: [], tournaments: [] }, clone(a), { password: '' }); rerenderAdmin(); $('#acc-name').focus(); return; }
      case 'acc-cancel': editingUser = null; rerenderAdmin(); return;
      case 'acc-save': {
        const u = editingUser;
        u.username = (u.username || '').trim().toLowerCase();
        if (!/^[a-z0-9._-]{3,30}$/.test(u.username)) { toast('Username: 3–30 lowercase letters or numbers.'); return; }
        if (u.isNew && accounts.find((a) => a.username === u.username)) { toast('That username is taken.'); return; }
        if ((u.isNew || u.password) && (u.password || '').length < (mode === 'live' ? 10 : 4)) { toast('Use at least 10 characters for the password.'); return; }
        try { await backend.saveUser({ username: u.username, name: u.name || u.username, role: u.role, clubs: u.role === 'club' ? u.clubs : [], tournaments: u.role === 'tournament' ? u.tournaments : [], password: u.password || undefined }); editingUser = null; accounts = null; toast('Account saved.'); rerenderAdmin(); }
        catch (err) { toast(err.message); }
        return;
      }
      case 'acc-del': pendingConfirm = 'acc-del:' + b.dataset.u; rerenderAdmin(); return;
      case 'acc-del-yes': try { await backend.deleteUser(b.dataset.u); pendingConfirm = null; accounts = null; rerenderAdmin(); toast('Account deleted.'); } catch (err) { toast(err.message); } return;
      // email
      case 'unsub': try { await backend.removeSub(b.dataset.email); subs = null; rerenderAdmin(); toast('Removed.'); } catch (err) { toast(err.message); } return;
      case 'addsub': { const em = $('#addsub-email').value.trim(); if (!validEmail(em)) { toast('Enter a full email address.'); return; } try { await backend.addSub(em, $('#addsub-name').value.trim()); subs = null; rerenderAdmin(); toast('Subscriber added.'); } catch (err) { toast(err.message); } return; }
      case 'subscsv': { const csv = 'email,name,since\n' + subs.map((s) => [s.email, s.name || '', s.date || ''].map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'); $('#csvbox').innerHTML = `<div class="field" style="margin-top:1rem"><label for="csvtext">Subscribers (CSV)</label><textarea id="csvtext" rows="6" readonly>${esc(csv)}</textarea></div>`; $('#csvtext').select(); return; }
      case 'mailtest': case 'mailall': case 'mailall-yes': case 'mailcontinue': {
        const d = mailDraft || {};
        if (act !== 'mailcontinue' && (!d.subject || !d.text)) { toast('Write a subject and a message first.'); return; }
        if (act === 'mailtest' && !validEmail(d.test)) { toast('Enter the address to send the test to.'); return; }
        if (act === 'mailall') { pendingConfirm = 'sendall'; rerenderAdmin(); return; }
        pendingConfirm = null;
        try {
          const r = await backend.send(act === 'mailtest' ? { subject: '[TEST] ' + d.subject, text: d.text, test: d.test } : act === 'mailcontinue' ? { continueId: b.dataset.id } : { subject: d.subject, text: d.text });
          toast(act === 'mailtest' ? 'Test sent to ' + d.test + '.' : `Sent to ${r.sent}.${r.remaining ? ' ' + r.remaining + ' will need "Continue sending" tomorrow.' : ''}`);
          if (act !== 'mailtest') { subs = null; rerenderAdmin(); }
        } catch (err) { toast(err.message); rerenderAdmin(); }
        return;
      }
      case 'sugg-to': { const to = $('#sugg-to').value.trim(); if (!validEmail(to)) { toast('Enter a full email address, like name@example.com.'); return; } try { await backend.setSuggestTo(to); sugg.to = to; toast('Suggestions will now go to ' + to + '.'); } catch (err) { toast(err.message); } return; }
      case 'sugg-del': pendingConfirm = 'sugg-del:' + b.dataset.key; rerenderAdmin(); return;
      case 'sugg-del-yes': try { await backend.deleteSuggestion(b.dataset.key); pendingConfirm = null; sugg = null; rerenderAdmin(); toast('Deleted.'); } catch (err) { toast(err.message); } return;
      case 'reset': pendingConfirm = 'reset'; rerenderAdmin(); return;
      case 'reset-yes': site = clone(window.DEFAULT_SITE); pendingConfirm = null; markDirty(); applyTheme(); render(); toast('Starting content loaded. Press Save to publish it.'); return;
      case 'cancel': pendingConfirm = null; rerenderAdmin(); return;
      case 'save-logout': await doSave(); if (!dirty) { pendingConfirm = null; logout(); location.hash = '#home'; } return;
      case 'discard-logout': pendingConfirm = null; dirty = false; site = await backend.load(); applyTheme(); logout(); location.hash = '#home'; return;
    }
    void e;
  }

  // ---- admin typing ----
  function onEdit(e) {
    const el = e.target, ds = el.dataset || {};
    if (ds.acc && editingUser) { editingUser[ds.acc] = el.value; if (ds.acc === 'role' && e.type === 'change') rerenderAdmin(); return; }
    if (ds.accitem && editingUser) { const arr = editingUser[ds.accitem]; const k = arr.indexOf(el.value); if (el.checked && k < 0) arr.push(el.value); if (!el.checked && k >= 0) arr.splice(k, 1); return; }
    if (ds.mail) {
      mailDraft = mailDraft || { tid: '', subject: '', text: '', test: '' };
      mailDraft[ds.mail] = el.value;
      if (ds.mail === 'tid' && e.type === 'change') { const t = site.tournaments.find((x) => x.id === el.value); if (t) Object.assign(mailDraft, reminderFor(t)); rerenderAdmin(); }
      return;
    }
    const path = ds.path;
    if (!path) return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (path === 'settings.baseSize') v = +v;
    setPath(path, v);
    markDirty();
    if (path.startsWith('settings.colors') || path === 'settings.font' || path === 'settings.headingFont' || path === 'settings.baseSize') {
      applyTheme();
      if (el.type === 'color') { const code = el.parentElement.querySelector('code'); if (code) code.textContent = v; }
      if (e.type === 'change' && path.startsWith('settings.colors')) rerenderAdmin();
    }
    if (/^settings\.(siteName|tagline|headerStyle|showSuits|footerText|contactEmail|alert\.)/.test(path) || /^pages\.\d+\.(title|show)$/.test(path)) renderChrome();
    const m = /^(.+?)\.(\d+)\./.exec(path);
    if (m) {
      const sum = document.querySelector(`[data-sum="${m[1]}.${m[2]}"]`);
      if (sum) { const S = SCHEMAS[sum.dataset.schema], it = getPath(m[1] + '.' + m[2]); sum.textContent = S.title(it); const sub = document.querySelector(`[data-subsum="${m[1]}.${m[2]}"]`); if (sub) sub.textContent = S.sub(it); }
      const d = document.getElementById(`derived-${m[1].replace(/\./g, '-')}-${m[2]}`);
      if (d) d.innerHTML = derivedHTML(m[1], +m[2]);
    }
  }
  document.addEventListener('input', onEdit);
  document.addEventListener('change', async (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.upload) {
      const f = el.files[0]; if (!f) return;
      toast('Uploading…');
      try { const url = await backend.upload(f, el.dataset.kind); setPath(el.dataset.upload, url); markDirty(); rerenderAdmin(); renderChrome(); toast('Uploaded. Press Save to update the site.'); }
      catch (err) { toast(err.message); }
      return;
    }
    if (el.dataset && el.dataset.multi) {
      const files = [...el.files]; if (!files.length) return;
      const arr = getPath(el.dataset.multi); let n = 0;
      for (const f of files) {
        toast(`Uploading photo ${n + 1} of ${files.length}…`);
        try { arr.push({ id: uid('ph'), url: await backend.upload(f, 'photo'), caption: '' }); n++; } catch (err) { toast(err.message); break; }
      }
      markDirty(); rerenderAdmin(); if (n) toast(`${n} photo${n === 1 ? '' : 's'} added. Add captions, then press Save.`);
      return;
    }
    if (el.type === 'color' || el.tagName === 'SELECT' || el.type === 'checkbox') onEdit(e);
  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'loginform') return;
    e.preventDefault();
    let ok = false;
    try { ok = await backend.login($('#un').value, $('#pw').value); } catch (err) { $('#loginerr').innerHTML = `<p style="color:#9B1C1C;font-weight:700">${esc(err.message)}</p>`; return; }
    if (ok) { accounts = null; subs = null; sugg = null; adminTab = myTabs()[0][0]; render(); toast('Logged in as ' + (user.name || user.username) + '.'); }
    else { $('#loginerr').innerHTML = '<p style="color:#9B1C1C;font-weight:700">That username or password is not correct. Check Caps Lock and try again.</p>'; $('#pw').select(); }
  });


  // ---------- global events ----------
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'size') { ls.set('u112-size', b.dataset.i); applyTheme(); renderChrome(); return; }
    if (act === 'hc') { ls.set('u112-hc', ls.get('u112-hc') === '1' ? '0' : '1'); applyTheme(); renderChrome(); return; }
    if (act === 'skip') { e.preventDefault(); $('#main').focus(); return; }
    if (act === 'clubday') { clubDay = b.dataset.day; $('#view').innerHTML = renderPublic('clubs'); const f = document.querySelector(`[data-act="clubday"][data-day="${clubDay}"]`); if (f) f.focus(); return; }
    if (act === 'photo') { lightbox = { album: b.dataset.album, i: +b.dataset.i, from: b }; renderLightbox(); return; }
    if (act === 'lb-close') { const from = lightbox && lightbox.from; lightbox = null; renderLightbox(); if (from && document.body.contains(from)) from.focus(); return; }
    if (act === 'lb-prev' || act === 'lb-next') { lightbox.i += act === 'lb-next' ? 1 : -1; renderLightbox(); return; }
    if (act === 'logout') { if (dirty) { pendingConfirm = 'logout'; location.hash = '#admin'; render(); return; } logout(); location.hash = '#home'; return; }
    if (act === 'save') { await doSave(); return; }
    if (typeof adminClick === 'function') adminClick(b, act, e);
  });
  document.addEventListener('keydown', (e) => {
    if (!lightbox) return;
    const al = (site.gallery || []).find((a) => a.id === lightbox.album);
    if (e.key === 'Escape') { lightbox = null; renderLightbox(); }
    else if (e.key === 'ArrowRight' && al && lightbox.i < al.photos.length - 1) { lightbox.i++; renderLightbox(); }
    else if (e.key === 'ArrowLeft' && lightbox.i > 0) { lightbox.i--; renderLightbox(); }
  });
  document.addEventListener('submit', async (e) => {
    const f = e.target;
    if (f.id === 'searchform' || f.id === 'searchform2') {
      e.preventDefault();
      searchQuery = (f.querySelector('input[type=search]').value || '').trim();
      if (route() === 'search') { render(); const q2 = $('#q2'); if (q2) { q2.focus(); } } else location.hash = '#search';
      return;
    }
    if (f.id === 'suggestform') {
      e.preventDefault();
      const msgEl = $('#suggestmsg'), message = $('#sg-msg').value.trim(), email = $('#sg-email').value.trim();
      if (message.length < 3) { msgEl.innerHTML = '<p class="formerr">Please write your suggestion first.</p>'; $('#sg-msg').focus(); return; }
      if (email && !validEmail(email)) { msgEl.innerHTML = '<p class="formerr">That email address does not look right. Leave it blank if you don\'t need a reply.</p>'; $('#sg-email').focus(); return; }
      const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
      try {
        await backend.suggest({ message, page: $('#sg-page').value, name: $('#sg-name').value.trim(), email, website: $('#sg-web').value });
        f.hidden = true; msgEl.innerHTML = `<p class="formok">Thank you! Your suggestion was sent to the webmaster.${email ? ' They may reply to ' + esc(email) + '.' : ''}</p>`; msgEl.focus && msgEl.setAttribute('tabindex', '-1'); msgEl.focus();
      } catch (err) { btn.disabled = false; msgEl.innerHTML = `<p class="formerr">${esc(err.message)}</p>`; }
      return;
    }
    if (f.id === 'signupform') {
      e.preventDefault();
      const email = $('#su-email').value.trim(), name = $('#su-name').value.trim(), msg = $('#signupmsg');
      if (!validEmail(email)) { msg.innerHTML = '<p class="formerr">Please enter a full email address, like name@example.com.</p>'; $('#su-email').focus(); return; }
      try { await backend.subscribe(email, name, $('#su-web').value); f.hidden = true; msg.innerHTML = `<p class="formok">Thank you. Reminders will go to <strong>${esc(email)}</strong>.</p>`; }
      catch (err) { msg.innerHTML = `<p class="formerr">${esc(err.message)}</p>`; }
    }
  });
  async function doSave() {
    try { await backend.save(site); dirty = false; renderChrome(); toast('Saved. The site is updated.'); }
    catch (err) { toast(err.message); }
  }
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- boot ----------
  (async function boot() {
    site = await backend.load();
    // fill any keys added in newer versions
    const D = window.DEFAULT_SITE;
    site.settings = Object.assign(clone(D.settings), site.settings || {});
    site.content = Object.assign(clone(D.content), site.content || {});
    site.recognition = Object.assign(clone(D.recognition), site.recognition || {});
    ['news', 'tournaments', 'clubs', 'board', 'documents', 'pages', 'gallery'].forEach((k) => { if (!Array.isArray(site[k])) site[k] = clone(D[k]); });
    site.learn = Object.assign(clone(D.learn), site.learn || {});
    site.settings.alert = Object.assign(clone(D.settings.alert), site.settings.alert || {});
    // Sections and built-in pages added in later versions of the site
    D.settings.homeSections.forEach((h, i) => { if (!site.settings.homeSections.find((x) => x.id === h.id)) site.settings.homeSections.splice(Math.min(i, site.settings.homeSections.length), 0, clone(h)); });
    D.pages.forEach((p, i) => { if (!site.pages.find((x) => x.id === p.id)) site.pages.splice(Math.min(i, site.pages.length), 0, clone(p)); });
    const T0 = { address: '', sessions: [], hotels: '', food: '', parking: '', partnership: '', contacts: '', details: '', bulletins: [] };
    ['tournaments', 'clubs', 'news', 'board', 'documents', 'gallery'].forEach((k) => site[k].forEach((it) => { if (!it.id) it.id = uid('x'); }));
    site.tournaments.forEach((t) => { Object.keys(T0).forEach((k) => { if (t[k] == null) t[k] = clone(T0[k]); }); });
    site.clubs.forEach((c) => { if (!Array.isArray(c.games)) c.games = []; });
    site.gallery.forEach((a) => { if (!Array.isArray(a.photos)) a.photos = []; });
    if ((token === 'demo' && mode === 'live') || (token && !user)) { token = null; user = null; ss.del('u112-token'); ss.del('u112-user'); }
    applyTheme();
    render();
  })();
})();

</script>
</body>
</html>
